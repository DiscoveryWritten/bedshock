# How the battery gets onto a device, and why that shapes everything else in this repository.
#
# NOT A QUESTION ABOUT WHAT A PACK CAN DO. These are questions about the client's content
# manager, which is upstream of every other row here: a capability nobody can install is a
# capability nobody can measure. They live in the catalog because they are exactly as
# version-dependent as the rest, exactly as undocumented, and considerably more expensive to
# rediscover -- the cost of learning these is measured in minutes of tapping per attempt.
#
# THIS FILE IS THE REASON THE SESSION IS SHAPED THE WAY IT IS. Read the first row and the
# constraint it imposes before designing anything that assumes iteration is cheap.

domain: distribution
about: >-
  Getting a pack onto a device and into a world. Every row here is a tax on iteration rather
  than a capability a design rests on, which is why they are worth writing down once instead of
  being rediscovered on every new machine by somebody with a tablet and no patience left.

capabilities:
  - id: distribution.mcaddon.reinstall_replaces_in_place
    question: >-
      Does importing an `.mcaddon` whose UUID is already installed replace the installed copy?
    decides: >-
      Whether iterating on an add-on is cheap or expensive, and therefore how much a single
      in-game session has to accomplish. If a rebuild costs one import, a session can be casual
      and repeated. If it costs an uninstall, an app restart and a world rebuild, then every
      session has to be one-pass, resumable in place, and worth the setup -- which is a hard
      constraint on the guided run rather than a preference.
    method: derived
    surface: engine
    established_by: >-
      Observed repeatedly on iPadOS across more than a hundred installs: the import is refused as
      a DUPLICATE rather than replacing anything. The old copy has to be uninstalled first, and
      the client caches the pack list hard enough that the app must be closed before the new copy
      is offered. Only marketplace content updates in place.

      Recorded as `derived` rather than measured because it is not reachable from inside a pack:
      no script API touches the content manager. It is a property of the client, established by
      somebody paying for it a hundred times.
    notes: >-
      THE CONSEQUENCE, and it is the one worth carrying: every rebuild costs a world delete and an
      import, so nothing may be designed on the assumption that reinstalling is a retry. A session
      must be re-runnable inside the world it is already in, the arena must be re-pavable on
      command, and a badly staged row must be fixable by re-staging rather than by rebuilding.

      This is also why `distribution.mcworld.carries_its_own_packs` below matters so much. It is
      the only route that avoids the content manager entirely.

  - id: distribution.mcworld.carries_its_own_packs
    question: >-
      Does a `.mcworld` containing its own `behavior_packs/` and `resource_packs/` folders import
      with those packs active, without touching the global pack list?
    decides: >-
      Whether the whole install loop can be skipped. World-local packs are never installed
      globally, so there is nothing to uninstall, nothing to be refused as a duplicate, nothing
      cached and nothing accumulating in storage. If this holds, updating the battery is: delete
      the old world, open the new file, join. If it does not, every update pays the content
      manager and the in-world experience has to be worth the toll.
    method: observed
    surface: engine
    probe: distribution
    look_at: >-
      Import the released `.mcworld` WITHOUT installing the `.mcaddon` first -- ideally on a
      device where the pack is not installed at all. Join the world, then check three things: the
      world exists with the name it was published under, `/scriptevent bedshock:probe` gets a
      response in chat, and the global pack list in Settings does NOT list a new bedshock entry.
    outcomes:
      - id: active_and_not_installed
        label: The battery responds, and no bedshock pack appears in the global list
        verdict: 'YES'
        means: >-
          World-local packs work. The install loop is dead: delete the old world, open the new
          file, join. Nothing to uninstall, nothing to collide, nothing to clean up.
      - id: active_but_also_installed
        label: The battery responds, but a bedshock pack has appeared in the global list
        verdict: 'YES'
        means: >-
          It works, but the import registered the pack globally as well -- so storage still
          accumulates and a later `.mcaddon` import of the same UUID would still be refused. Worth
          knowing before relying on it for a hundred more versions.
      - id: world_loads_pack_inert
        label: The world imports and joins, but no script event gets a response
        verdict: 'NO'
        means: >-
          The bindings resolved to nothing: the world named its packs and the client did not find
          them where the archive put them. The packaging layout is wrong, and the fix is in
          `tools/world.ts` rather than in the game.
      - id: import_refused
        label: The import itself failed or the world never appeared
        verdict: INCONCLUSIVE
        means: >-
          The archive is malformed rather than the mechanism being unsupported. Nothing has been
          learned about world-local packs; check the zip before concluding anything.
    notes: >-
      THE ONE ROW HERE THAT IS A BET RATHER THAN A REPORT. World-local packs are how essentially
      every distributed Bedrock map ships an add-on, and the mechanism is not in doubt in general
      -- what is unverified is this client, this version, and this archive layout. It is the
      cheapest possible thing to check: one import, before any measuring starts, and it fails at
      the first tap rather than wasting a session.

      IF THE BATTERY IS RUNNING AT ALL FROM AN IMPORTED WORLD ON A DEVICE THAT NEVER INSTALLED THE
      PACK, this is already answered YES by construction. The look above is really asking the
      second half: whether it ALSO installed globally, which decides whether storage keeps growing.
