# Physics, timing and the numbers a design gets tuned to.
#
# EVERY ROW HERE IS `solved` RATHER THAN YES/NO, and that is the point of the file. The rest of
# this battery asks whether a thing is possible. These ask HOW MUCH, and record the number.
#
# A yes/no capability only reports when something appears or disappears. A solved one reports
# when the game's numbers shift underneath a design that was tuned to them -- a reference
# implementation that still runs, still passes, and is now subtly wrong. Nothing else in this
# battery would notice that, and it is the failure most likely to survive a release.
#
# These are also the rows most likely to move for uninteresting reasons. A solve has real jitter:
# tick granularity, spawn rounding, floating point. So every row declares a `tolerance` taken
# from its own apparatus's resolution, and a movement inside that is not a finding. A tolerance
# of zero would report DRIFT on noise, and a drift people learn to ignore is worse than none.

domain: physics
about: >-
  The measurable constants of Bedrock's own behaviour: how fast things fall, how far they are
  thrown, how close two moving things can pass. None of these are documented and all of them get
  designed against. A probe here does not check a condition -- it searches for the boundary, and
  the boundary is the answer.

capabilities:
  - id: physics.falling_block.gravity_curve
    question: >-
      What downward velocity does a vanilla falling block reach after a fixed number of ticks?
    decides: >-
      Whether a mechanic can predict where a falling block will be, rather than watching it. It
      is also the control for every other row in this file: if this number moves, the engine's
      integration changed and nothing else measured here can be compared across that boundary.
    method: solved
    surface: engine
    probe: fallcurve
    measures:
      unit: blocks_per_tick
      direction: maximum
      # One tick of drag applied or not applied is about this much at the sampled tick. Below
      # that is arithmetic noise rather than a change in the game.
      tolerance: 0.01
      search: { from: -4, to: 0 }
    notes: >-
      Recorded once already, informally, as `-0.04, -0.12, -0.19, -0.26, -0.33` at ticks 2..10.
      Those numbers are what confirm a watched entity is the real falling block rather than a
      look-alike, so this row doubles as the identity check for
      `entity.falling_block.is_trackable_by_script`.

      IT ALREADY EARNED ITS KEEP, and not in the way it was written for. On 1.26.36.1 this read
      0.5697 from 31 sightings, then 0.6777 from 52 -- a move of ten times its own tolerance --
      with nothing about Bedrock having changed between the two. A neighbouring probe had been
      carving the same column and deleting the anvil part-way down, so every earlier reading was
      a truncated fall. The engine's integration had not moved; the apparatus had.

      So read the control's warning both ways. If this number moves, either the engine changed or
      SOMETHING ABOUT THE RIG DID, and until you know which, nothing else measured in this file
      is comparable across that boundary. A number that moves for a reason nobody identified is
      not a finding yet.

  - id: physics.falling_block.min_clearance_under_a_falling_anvil
    question: >-
      How far above a falling anvil can a block vacate its path and still be clear when the
      anvil arrives?
    decides: >-
      The tightest a pass-under mechanic can be built before it becomes unreliable. Something has
      to move out of the way, moving takes time, and this is how much room that time costs. It is
      a technical problem asking to be optimised into a reference implementation, and the number
      it optimises to is only meaningful if somebody is watching whether it moves.
    method: solved
    surface: engine
    probe: anvilgap
    measures:
      unit: blocks
      # MAXIMUM, and the direction was inverted by a measurement rather than by reasoning.
      #
      # The first runnable apparatus removed the obstruction and left it gone, which made the
      # search a minimum: how LATE can it leave. Bedrock 1.26.36.1 answered `held even at 0` --
      # removal keyed to the anvil's own arrival is never late, so every clearance passed. The
      # probe now puts the block BACK after a fixed window, which makes the clearance mean how
      # EARLY the mover leaves, and early is the direction that eventually fails.
      direction: maximum
      # ONE TICK OF TRAVEL, and this number is the apparatus rather than an ambition.
      #
      # The anvil only exists at tick-spaced positions, so the finest clearance the probe can
      # distinguish is how far it moves in one tick -- about 0.6 blocks by the time it reaches
      # the plane after a six-block drop. Asking for finer would report DRIFT on tick phase
      # forever, and a drift report people learn to ignore is worse than no drift report.
      #
      # Shorten the drop and this gets finer; lengthen it and it gets coarser. If the drop in
      # `content/pack.yaml` changes, this has to change with it.
      tolerance: 0.6
      # Past the drop height on purpose, and both ends are now grounded in a run rather than in
      # reasoning. Zero clearance passing is what 1.26.36.1 reported when the block simply left;
      # a clearance wider than the whole drop puts the block back long before the anvil is near
      # it, so the tight end must fail by construction. `bedshock test` pins that.
      search: { from: 0, to: 8 }
    notes: >-
      THE FAILURE MODE TO WATCH FOR is a solve that converges on its own search bound. A result
      sitting exactly at `from` or `to` usually means the trial never actually failed, or never
      actually passed -- so the probe reports INCONCLUSIVE at a bound rather than recording the
      bound as an answer. A number that is really the edge of the search is not a measurement of
      anything.

      WHAT THIS NUMBER IS PHYSICALLY. It is how far the anvil travels while the plane is empty,
      which is why the vacate window in `content/pack.yaml` is part of what the row MEANS rather
      than a tuning detail -- widen the window and the number grows, and readings taken either
      side of that change are not comparable. It is close kin to the tunnelling threshold: a fast
      enough mover crosses a whole block between two ticks and is never seen inside it at all.

  - id: physics.throw.item_travel_distance
    question: >-
      How far does an item given a fixed impulse travel before coming to rest on flat ground?
    decides: >-
      Whether a mechanic that throws something can predict where it lands. Recorded not because
      throw distance is interesting in itself, but because anything built on top of it inherits
      the drag, the friction and the integration underneath it -- and a design tuned to the old
      numbers fails in a way that looks like a bug in the design rather than a change in the game.
    method: solved
    surface: engine
    probe: throw
    measures:
      unit: blocks
      direction: maximum
      tolerance: 0.25
      # A plausibility range rather than a bracket to bisect. This row is MEASURED, not searched:
      # the item lands somewhere and the somewhere is the answer, so these bounds only say what
      # an answer could possibly be. A reading outside them is the apparatus -- an item that fell
      # down a hole, or an entity that was not the one thrown -- and is discarded rather than
      # averaged in.
      search: { from: 0, to: 24 }
    notes: >-
      THE NUMBER IS RELATIVE TO AN IMPULSE. A player's throw is not scriptable, so the probe
      applies the impulse declared in `content/pack.yaml` and reports what it buys. Change that
      impulse and this number changes for a reason that has nothing to do with Bedrock, and
      readings from either side of the change are not comparable -- the same trap as the anvil's
      vacate window, in a different costume.

      The tolerance is a quarter of a block: about the difference one tick of contact with the
      ground makes at the speed the item is still carrying when it first lands.

  - id: physics.knockback.blocks_per_unit
    question: How far does one unit of `applyKnockback` actually move a player?
    decides: >-
      Whether any momentum design can be written at all. `applyKnockback` is the only way to
      impose a velocity on a player -- `applyImpulse` refuses them outright -- and its unit is
      undocumented, so every use of it anywhere is a constant somebody tuned by hand until it
      looked right.
    method: solved
    surface: script
    probe: knockback
    measures:
      unit: blocks_per_unit
      direction: maximum
      tolerance: 0.1
      # Plausibility bounds, not a bisection bracket. See the note on the throw row above.
      search: { from: 0, to: 20 }
    notes: >-
      Marked `script` rather than `engine` deliberately. The distance travelled is engine
      behaviour, but what one UNIT means is an API contract, and that is the part that moves when
      the module version moves. A consumer raising their script pin should see this row as one
      that might change under them.

      MEASURED WITH NO VERTICAL COMPONENT. A knockback with lift travels much further, so mixing
      the two would make the number depend on a choice the apparatus made rather than on the
      engine. Anything wanting the airborne figure is asking a different question and wants its
      own row.

      Only answerable with a player present, so a server run skips it. Its sibling below is the
      one that runs headless, and the pair existing separately is the point.

  - id: physics.knockback.blocks_per_unit_on_an_entity
    question: How far does one unit of `applyKnockback` move an ordinary entity?
    decides: >-
      Whether one momentum constant covers everything a mechanic might move, or whether players
      and everything else need separate numbers. A design that pushes both through the same call
      and assumes the same result is resting on a proposition nobody has checked.
    method: solved
    surface: script
    probe: knockback
    measures:
      unit: blocks_per_unit
      direction: maximum
      tolerance: 0.1
      search: { from: 0, to: 20 }
    notes: >-
      The same call, the same arena, the same rest test as the player row -- differing in the
      subject and in nothing else, which is what makes a difference between the two attributable
      to the subject.

      WHAT TO DO IF THESE TWO DIVERGE: treat the player row as the one your design has to respect
      and this one as the warning that a shared constant is wrong. They are recorded separately
      precisely so that divergence is visible rather than averaged away.

      THE SUBJECT IS PART OF WHAT THIS ROW MEANS, and it is a dropped item -- named in
      `content/pack.yaml` rather than left implicit. The first apparatus used an armour stand and
      Bedrock 1.26.36.1 reported `the subject never moved at all` five times out of five: vanilla
      armour stands resist knockback outright. Worth knowing on its own, and a reminder that
      "an ordinary entity" is not one thing. A reading taken against a different subject is not
      comparable with this one.
