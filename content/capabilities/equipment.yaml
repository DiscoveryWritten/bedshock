# The equipment slots, and the off-hand in particular.
#
# The off-hand is the only slot that renders an arbitrary held item in the world without any
# attachable work, which makes it perpetually attractive and worth measuring properly.

domain: equipment
about: >-
  What script can put in a player's equipment slots, and whether it stays there. The gap
  between those two is the whole content of this file: acceptance by the API is not
  persistence, and the client has opinions the API does not report.

capabilities:
  # --- the control ---------------------------------------------------------
  - id: equipment.offhand.vanilla_permitted_item_persists
    question: >-
      Does a vanilla item the off-hand normally accepts -- a shield -- stay there when a script
      puts it in?
    decides: >-
      Nothing on its own, and that is the point. This is the CONTROL for every other row in this
      file: it is the one that is SUPPOSED to work.

      If it does not stay, the apparatus is broken -- the write never landed, or the read is
      looking at the wrong slot, or there was no player there at all -- and every negative in this
      file is measuring the probe rather than the game. Without it, a probe that had silently
      stopped writing anything would report exactly the same confident row of NOs as one working
      perfectly, and a manifest people design around would be built on it.
    method: automated
    surface: engine
    probe: offhand
    notes: >-
      READ THIS ROW FIRST when anything else in the file changes. A negative here invalidates the
      whole file for that version; a negative anywhere else, with this one green, is a finding.

  - id: equipment.offhand.accepts_a_script_placed_item
    question: Does `setEquipment(Offhand, ...)` succeed for an item the slot would not normally take?
    decides: >-
      Whether the API refuses outright. Separating this from whether the item STAYS is the
      whole point -- a refusal and an ejection look identical a moment later, and they point at
      different workarounds.
    method: automated
    surface: script
    probe: offhand
    legacy: P9

  - id: equipment.offhand.script_placed_item_persists
    question: >-
      Is a script-placed arbitrary vanilla item still in the off-hand a few seconds later?
    decides: >-
      Whether the off-hand is free in-world rendering of an arbitrary item -- modded ones
      included -- with no attachable work at all. If it is, a whole class of display problem
      has a shortcut. If it is not, rendering an arbitrary held item has no shortcut around
      attachables.
    method: automated
    surface: engine
    probe: offhand
    depends_on: [equipment.offhand.accepts_a_script_placed_item]
    legacy: P9
    notes: >-
      The probe reads the slot back immediately -- confirming the write landed -- and again
      after a delay. Both readings are in the measurement, because "never arrived" and "arrived
      and was ejected" are different findings.

      MEASURED ACROSS A SPREAD OF ITEMS, not one. A plain material, a tool, a block and a food,
      because "arbitrary items are ejected" and "that particular item is ejected" are different
      claims and only the first is worth publishing. The verdict is YES only if every one of them
      stays and NO if any is ejected -- and if the result is mixed, the per-item breakdown is in
      the measurement and the evidence names which survived, because a partial allow-list is a
      far more useful thing for a mod author than either flat answer.

      THIS IS A ROW WE EXPECT TO BE NO, and it is on the watchlist for exactly that reason. A
      negative here is not a closed file: it is the question that gets re-asked on every Bedrock
      nobody has looked at yet, so that the day it flips, the proof was written months earlier.

  - id: equipment.offhand.ejected_item_survives
    question: >-
      When the client ejects a script-placed item from the off-hand, does the item still exist?
    decides: >-
      Whether writing to the off-hand is SAFE TO ATTEMPT AT ALL. Everything else in this file is
      about whether a trick works; this is about what it costs when it does not. An ejection that
      returns the item to the inventory or drops it on the floor is a failed effect. An ejection
      that destroys it is a pack eating a player's diamonds, and no amount of graceful degradation
      elsewhere makes that acceptable.
    method: automated
    surface: engine
    probe: offhand
    depends_on: [equipment.offhand.accepts_a_script_placed_item]
    notes: >-
      Only meaningful while `equipment.offhand.script_placed_item_persists` is NO -- if the item
      stays, nothing was ejected and there is nothing to survive. The probe reports INCONCLUSIVE
      rather than a verdict in that case, because "it was not destroyed" is trivially true of an
      item that never left.

      The measurement records WHERE it went -- back to the inventory, onto the floor as an entity,
      or nowhere -- since those are three different things to design around and only the third is
      a reason not to try at all.

  - id: equipment.offhand.custom_item_declaring_allow_off_hand_persists
    question: >-
      Does a custom item whose own definition declares `allow_off_hand` stay in the off-hand?
    decides: >-
      Whether the ejection is about the SLOT or about the ITEM. If our own items stay, the
      off-hand is usable for anything we ship and unusable only for items we do not control --
      which is a much narrower limit than "the off-hand is out".
    method: automated
    surface: content
    probe: offhand
    depends_on: [equipment.offhand.accepts_a_script_placed_item]
    legacy: P9

  - id: equipment.offhand.player_can_place_an_arbitrary_item
    question: Can a player put an arbitrary item in the off-hand by hand?
    decides: >-
      Whether the off-hand can be an INPUT -- somewhere a player deliberately puts something
      for a pack to notice.
    method: derived
    surface: engine
    established_by: >-
      The off-hand only accepts items whose definition permits it. This is vanilla behaviour
      and is what rules out "put anything in your off-hand, then open the menu" as an input
      gesture.

  - id: equipment.offhand.has_a_use_input
    question: Is there an off-hand use input on any Bedrock platform?
    decides: >-
      Whether an off-hand item can be interactive, or is inert decoration. Inert suits a
      decoration; it rules out anything that wanted to be a second tool.
    method: derived
    surface: engine
    established_by: Bedrock has no off-hand use input on any platform.
